<header class="site-header">
  <div class="container nav-wrap">
    <a routerLink="/" class="brand" aria-label="Azulcode — página inicial">
      <img src="assets/images/corp/logoClaro.png" alt="" width="50" height="53" />
      <span class="brand-text">AZULCODE<small>TECNOLOGIA DA INFORMAÇÃO</small></span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Alternar menu principal">
      <span></span><span></span><span></span>
    </button>

    <nav class="menu" [class.is-open]="menuOpen" aria-label="Menu principal">
      <a *ngFor="let item of menuItems$ | async"
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.route === '/' }"
         (click)="closeMenu()">
         {{ item.label }}
      </a>
    </nav>
  </div>
</header>
