<footer class="site-footer">
    <div class="container footer-grid">
        <div class="footer-brand">
            <a routerLink="/" class="footer-logo">
                <img src="assets/images/corp/logoClaro.png" alt="" width="58" height="61" />
                <span>AZULCODE</span>
            </a>
            <p>Consultoria e desenvolvimento de software.</p>
            <small>CNPJ {{ company.cnpj }}</small>
        </div>

        <nav aria-label="Links institucionais" class="footer-nav">
            <h2>Navegação</h2>
            <a routerLink="/">Início</a>
            <a routerLink="/quem-somos">Empresa</a>
            <a routerLink="/projetos">Projetos</a>
            <a routerLink="/contato">Contato</a>
        </nav>

        <nav aria-label="Canais oficiais" class="footer-social">
            <h2>Canais oficiais</h2>
            <a *ngFor="let link of socialLinks" [href]="link.href" target="_blank" rel="noopener noreferrer">
                {{ link.label }} <span aria-hidden="true">↗</span>
            </a>
        </nav>
    </div>
    <div class="copyright">
        <div class="container copyright-inner">
            <span>© {{ currentYear }} Azulcode Tecnologia da Informação</span>
            <span>Software pensado para resolver problemas reais.</span>
        </div>
    </div>
</footer>
